# Server Configuration
server:
  port: ${GATEWAY_SERVER_PORT}

# API Configuration
app:
  api-prefix: /api/v1

# Application Name
spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=${app.api-prefix}/profiles/**
          filters:
            - StripPrefix=2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.pureevilstore.gateway: DEBUG
