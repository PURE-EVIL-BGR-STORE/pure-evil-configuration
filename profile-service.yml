server:
  port: 
  servlet:
    context-path: /profiles

spring:
  application:
    name: profile-service
  cloud:
    compatibility-verifier:
      enabled: false
  # PostgreSQL Database
  datasource:
    url: 
    username: 
    password: 
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/pureevilstore}

  # Config Kafka AMQP
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Config Identity Service
identity-service:
  url: ${IDENTITY_SERVICE_URL:http://localhost:8180}
  client-id: ${IDENTITY_CLIENT_ID:pureevilstore}
  client-secret: ${IDENTITY_CLIENT_SECRET:hhByL1xDjmL9kwypUIM26SHJjLXllTHt}
  realm-name: ${IDENTITY_REALM_NAME:pureevilstore}

# Config AWS S3
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}

# Config Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Config SpringDoc / Swagger UI
springdoc:
  api-docs: 
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
